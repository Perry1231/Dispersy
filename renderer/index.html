<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <meta name="color-scheme" content="dark" />
  <title>Dispersy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Fixed top bar: stays in place when the sidebar collapses. -->
    <header class="topbar">
      <button class="topbar-btn panel-toggle" id="panelToggle" type="button" aria-label="Toggle panel">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2" y="2.5" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
      <button class="topbar-btn brand-btn" id="homeBtn" type="button">Dispersy</button>
      <button class="topbar-btn models-btn" id="modelsBtn" type="button" aria-label="Models">Models</button>
      <button class="topbar-btn icon-btn help-btn" id="helpBtn" type="button" aria-label="Help">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9.3 9.2a2.8 2.8 0 0 1 5.44.93c0 1.87-2.8 2.8-2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="16.6" r="0.9" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <div class="row" id="row">
      <aside class="sidebar">
        <!-- Actions -->
        <nav class="side-nav">
          <button class="side-btn nav-item" id="newTaskBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.9 4.5H6.5A1.5 1.5 0 0 0 5 6v11.5A1.5 1.5 0 0 0 6.5 19H18a1.5 1.5 0 0 0 1.5-1.5v-6.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M10.2 13.8l7.4-7.4a1.4 1.4 0 0 0-2-2l-7.4 7.4-.5 2.5 2.5-.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            New task
          </button>
          <button class="side-btn nav-item" id="searchBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="m20.5 20.5-4.8-4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            Search
          </button>
          <button class="side-btn nav-item" id="graphsBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="6.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="18" cy="9.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="10.5" cy="17.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8.3 7.4l7.4 1.3M7 8.6l2.6 6.8M16.9 11.5l-4.9 4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Graphs
          </button>
        </nav>

        <!-- Task list header: sorting + archive switch -->
        <div class="side-header">
          <p class="side-label" id="sideLabel">Tasks</p>
          <button class="header-icon-btn" id="sortBtn" type="button" aria-label="Sort tasks" title="Sort tasks">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.5 4.5v15M4.5 8l3-3.5 3 3.5M16.5 19.5v-15M13.5 16l3 3.5 3-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="header-icon-btn" id="archiveToggleBtn" type="button" aria-label="Archived tasks" title="Archived tasks">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 3h19v5h-19z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M4.5 8v12.5h15V8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M10 12.5h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="mini-pop sort-pop hidden" id="sortPop">
            <button class="sort-option" type="button" data-sort="created">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Last created
            </button>
            <button class="sort-option" type="button" data-sort="used">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Most used
            </button>
          </div>
        </div>

        <!-- Created tasks appear here -->
        <div class="side-tasks" id="taskList"></div>

        <!-- Bottom: account + settings -->
        <div class="side-bottom">
          <button class="side-btn account-btn" id="accountBtn" type="button">
            <span class="avatar" aria-hidden="true">D</span>
            Account
          </button>
          <button class="side-btn icon-btn settings-btn" id="settingsBtn" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </aside>

      <!-- Work area -->
      <main class="main">
        <!-- Models window: blurred backdrop + centered window with a close button -->
        <div class="models-overlay hidden" id="modelsOverlay">
          <div class="models-window" id="modelsWindow">
            <button class="models-close" id="modelsClose" type="button" aria-label="Close">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Home: prompt line in the middle of the window -->
        <section class="view home-view" id="homeView"></section>

        <!-- Graphs: graph of the selected task, or a "nothing selected" message -->
        <section class="view graphs-view hidden" id="graphsView">
          <div class="empty-state" id="graphsEmpty">
            <p class="empty-title" id="emptyTitle">No task selected</p>
            <p class="empty-sub" id="emptySub">Start a new task to see its graph.</p>
          </div>
          <div class="graph-wrap hidden" id="graphWrap">
            <svg id="graphSvg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
        </section>

        <!-- Prompt line: moved between views by script -->
        <form class="prompt-box" id="promptBox" autocomplete="off">
          <input id="promptInput" type="text" placeholder="Type a prompt…" spellcheck="false" />
          <button class="picker-btn" id="modelPickerBtn" type="button" aria-label="Models" title="Models">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 2.5 8 12 13l9.5-5L12 3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M2.5 13 12 18l9.5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            <span class="picker-count hidden" id="pickerCount"></span>
          </button>
          <!-- Small model picker that opens right above the prompt line -->
          <div class="mini-pop model-pop hidden" id="modelPop">
            <p class="pop-title" id="modelPopTitle">Models</p>
            <div id="modelPopList"></div>
            <p class="pop-hint hidden" id="modelPopHint">Model settings — coming soon</p>
          </div>
          <button class="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 13V3M3.8 7.2 8 3l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </main>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
